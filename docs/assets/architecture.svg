<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 680" width="1040" height="680" role="img" aria-labelledby="t d">
<title id="t">ContextVerity architecture</title>
<desc id="d">Agents call ContextVerity directly over HTTP or through the official Backstage MCP Actions backend and Actions Registry. The backend plugin uses the deterministic core engine and Backstage adapters for the Software Catalog and Permission Framework, stores receipts through the Backstage database service, and emits OpenTelemetry spans and metrics. A frontend plugin lists receipts.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5 0 10Z" fill="#4A5468"/></marker><marker id="ahc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5 0 10Z" fill="#2E3FBF"/></marker></defs>
<rect width="1040" height="680" rx="16" fill="#F6F7FA"/>
<text x="30" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#172036">Architecture</text>
<text x="30" y="66" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" fill="#4A5468">ContextVerity packages (blue outline) run inside a Backstage 1.55 backend and app. Grey boxes are Backstage or upstream parts.</text>
<rect x="30" y="100" width="200" height="82" rx="8" fill="#FFFFFF" stroke="#172036" stroke-width="1.4"/>
<text x="44" y="128" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#172036">Agent or engineer</text>
<text x="44" y="150" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#4A5468">HTTP client, or an</text>
<text x="44" y="168" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#4A5468">MCP client</text>
<text x="54" y="214" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#4A5468">MCP tools</text>
<text x="54" y="231" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#4A5468">contextverity.resolve-context</text>
<text x="54" y="246" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#4A5468">contextverity.verify-receipt</text>
<text x="54" y="284" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="11" fill="#2E3FBF">HTTP /api/contextverity/v1</text>
<rect x="30" y="470" width="200" height="150" rx="8" fill="#FFFFFF" stroke="#2E3FBF" stroke-width="1.4"/>
<text x="44" y="492" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#2E3FBF">@contextverity/</text><text x="44" y="507" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#2E3FBF">plugin-contextverity</text>
<text x="44" y="532" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#172036">Frontend plugin</text>
