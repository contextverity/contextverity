<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="t d">
<title id="t">Drift to verdict mapping</title>
<desc id="d">Example drift items such as OWNER_CHANGED, API_CHANGED, CLASSIFICATION_RAISED and PERMISSION_REVOKED with their effects. Animated: items appear one by one and the running verdict flips from VALID to REFRESH to DENY, because the verdict is the strongest effect.</desc>
