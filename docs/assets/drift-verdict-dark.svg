nite}.r3{animation:r3 14s linear infinite}.f3{opacity:0;animation:f3 14s linear infinite}.r4{animation:r4 14s linear infinite}.f4{opacity:0;animation:f4 14s linear infinite}.r5{animation:r5 14s linear infinite}.f5{opacity:0;animation:f5 14s linear infinite}.r6{animation:r6 14s linear infinite}.f6{opacity:0;animation:f6 14s linear infinite}.vV{opacity:0;animation:vV 14s linear infinite}.vR{opacity:0;animation:vR 14s linear infinite}.vD{animation:vD 14s linear infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important}.dot{display:none}}</style>
