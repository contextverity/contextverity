<text x="40" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#E5E9F2">Drift items map to effects; the verdict is the strongest effect</text>
<text x="40" y="68" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#A6B0C3">Each typed drift code carries an effect of NONE, REFRESH or DENY. Policies can escalate an effect. No model is consulted.</text>
