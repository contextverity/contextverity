<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="t d">
<title id="t">ContextVerity flow</title>
<desc id="d">Fetch from the Backstage catalog, build a ContextSnapshot, issue a ContextReceipt; later, after something changes, verify and receive VALID, REFRESH or DENY. Animated: a pulse travels the pipeline three times, ending at VALID (no relevant change), REFRESH (owner changed) and DENY (permission revoked).</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5 0 10Z" fill="#A6B0C3"/></marker><marker id="ahc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5 0 10Z" fill="#A3AEFF"/></marker><path id="p1" d="M292 161H351"/><path id="p2" d="M607 161H666"/><path id="p3" d="M795 236V262H165V290"/><path id="p4" d="M292 362H351"/><path id="v0" d="M607 362L638 315"/><path id="v1" d="M607 362H638"/><path id="v2" d="M607 362L638 409"/></defs>
<style>@keyframes hl0{0%{opacity:0}22%{opacity:0}22.8%{opacity:1}32%{opacity:1}32.8%{opacity:0}100%{opacity:0}}@keyframes vt0{0%{opacity:0}10%{opacity:0}10.8%{opacity:1}32%{opacity:1}32.8%{opacity:0}100%{opacity:0}}@keyframes hl1{0%{opacity:0}55.33%{opacity:0}56.13%{opacity:1}65.33%{opacity:1}66.13%{opacity:0}100%{opacity:0}}@keyframes vt1{0%{opacity:0}43.33%{opacity:0}44.13%{opacity:1}65.33%{opacity:1}66.13%{opacity:0}100%{opacity:0}}@keyframes hl2{0%{opacity:0}88.67%{opacity:0}89.47%{opacity:1}98.67%{opacity:1}99.47%{opacity:0}100%{opacity:0}}@keyframes vt2{0%{opacity:0}76.67%{opacity:0}77.47%{opacity:1}98.67%{opacity:1}99.47%{opacity:0}100%{opacity:0}}@keyframes sv{0%{opacity:0}16.67%{opacity:0}17.47%{opacity:1}20.67%{opacity:1}21.47%{opacity:0}100%{opacity:0}}@keyframes sv1{0%{opacity:0}50%{opacity:0}50.8%{opacity:1}54%{opacity:1}54.8%{opacity:0}100%{opacity:0}}@keyframes sv2{0%{opacity:0}83.33%{opacity:0}84.13%{opacity:1}87.33%{opacity:1}88.13%{opacity:0}100%{opacity:0}}.hl0{animation:hl0 24s linear infinite}.vt0{animation:vt0 24s linear infinite}.hl1{animation:hl1 24s linear infinite}.vt1{animation:vt1 24s linear infinite}.hl2{animation:hl2 24s linear infinite}.vt2{animation:vt2 24s linear infinite}.vt0,.vt2,.hl0,.hl1,.hl2{opacity:0}.vt1{opacity:1}.sv{opacity:0;animation:sv 24s linear infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important}.dot{display:none}}</style>
<rect width="960" height="470" rx="16" fill="#0D1322"/>
<text x="40" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#E5E9F2">From resolution to verification</text>
<text x="40" y="68" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#A6B0C3">Every value an agent receives is recorded, digested and checked again before it is reused.</text>
<rect x="40" y="96" width="250" height="130" rx="8" fill="#151D30" stroke="#2A3550" stroke-width="1.25"/><text x="58" y="128" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" fill="#E5E9F2">Fetch</text><text x="58" y="154" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#A6B0C3">Backstage Software Catalog:</text><text x="58" y="174" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#A6B0C3">owner, lifecycle, dependencies,</text><text x="58" y="194" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#A6B0C3">APIs, docs ref, classification</text>
<rect x="355" y="96" width="250" height="130" rx="8" fill="#151D30" stroke="#2A3550" stroke-width="1.25"/><text x="373" y="128" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="17" font-weight="700" fill="#E5E9F2">ContextSnapshot</text><text x="373" y="154" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#A6B0C3">Normalized source records</text><text x="373" y="174" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#A6B0C3">SHA-256 digest per record over</text><text x="373" y="194" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#A6B0C3">canonical JSON</text>
