<text x="682" y="312" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#5BD09A">VALID</text>
<text x="682" y="328" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#A6B0C3">Still matches; reuse</text>
