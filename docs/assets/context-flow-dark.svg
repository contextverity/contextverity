<text x="688" y="128" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="17" font-weight="700" fill="#A3AEFF">ContextReceipt</text>
<text x="688" y="154" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#A6B0C3">Immutable, server-authoritative</text>
<text x="688" y="174" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#A6B0C3">HMAC-SHA256 integrity tag</text>
<text x="688" y="194" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#A6B0C3">consumer, subject, purpose, TTL</text>
<path d="M292 161H351" fill="none" stroke="#A6B0C3" stroke-width="1.6" marker-end="url(#ah)"/><path d="M607 161H666" fill="none" stroke="#A6B0C3" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M795 236V262H165V290" fill="none" stroke="#A3AEFF" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#ahc)"/>
<text x="480" y="255" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" text-anchor="middle" fill="#A3AEFF">Later, before the context is reused</text>
<rect x="40" y="294" width="250" height="136" rx="8" fill="#151D30" stroke="#F2B451" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="58" y="324" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" fill="#E5E9F2">Something changes</text>
<text x="58" y="348" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#A6B0C3">Owner, API definition, relations,</text>
<text x="58" y="366" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#A6B0C3">classification, permissions,</text>
<text x="58" y="384" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#A6B0C3">policy, or simply time (TTL)</text>
<g class="vt0"><text x="58" y="414" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#5BD09A">now: no relevant change</text></g><g class="vt1"><text x="58" y="414" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#F2B451">now: owner changed</text></g><g class="vt2"><text x="58" y="414" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#FF7F9A">now: permission revoked</text></g>
<rect x="355" y="294" width="250" height="136" rx="8" fill="#151D30" stroke="#2A3550" stroke-width="1.25"/><text x="373" y="326" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" fill="#E5E9F2">Verify</text><text x="373" y="352" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#A6B0C3">Re-check binding and intent,</text><text x="373" y="372" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#A6B0C3">policy, TTL and permissions;</text><text x="373" y="392" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#A6B0C3">re-fetch and compare sources</text>
