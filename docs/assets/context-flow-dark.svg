<text x="682" y="359" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#F2B451">REFRESH</text>
<text x="682" y="375" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#A6B0C3">No longer current; re-resolve</text>
<rect x="642" y="388" width="278" height="42" rx="10" fill="#3A1520" stroke="#FF7F9A" stroke-width="1.5"/>
<g transform="translate(664 409) scale(1)"><rect x="-7.5" y="-7.5" width="15" height="15" rx="2.5" fill="#FF7F9A"/><rect x="-4.3" y="-1.25" width="8.6" height="2.5" rx="1" fill="#0D1322"/></g>
