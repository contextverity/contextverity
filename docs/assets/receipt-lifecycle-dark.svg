<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img" aria-labelledby="t d">
<title id="t">ContextReceipt lifecycle</title>
<desc id="d">Resolve, authorize, fetch and digest, issue a receipt; verify before reuse; VALID reuses, REFRESH re-resolves, DENY stops. Resolution can be refused with RESOLVE_DENIED.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5 0 10Z" fill="#A6B0C3"/></marker><marker id="ahv" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5 0 10Z" fill="#5BD09A"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5 0 10Z" fill="#F2B451"/></marker><marker id="ahd" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5 0 10Z" fill="#FF7F9A"/></marker></defs>
<rect width="960" height="500" rx="16" fill="#0D1322"/>
<text x="40" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#E5E9F2">Receipt lifecycle</text>
<text x="40" y="68" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#A6B0C3">A receipt is issued once, never edited, and verified each time the context is about to be reused.</text>
<rect x="40" y="100" width="200" height="96" rx="8" fill="#151D30" stroke="#2A3550" stroke-width="1.25"/><text x="56" y="128" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#E5E9F2">Resolve</text><text x="56" y="150" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#A6B0C3">POST /v1/resolve</text><text x="56" y="168" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#A6B0C3">subject, purpose, categories</text>
<rect x="290" y="100" width="200" height="96" rx="8" fill="#151D30" stroke="#2A3550" stroke-width="1.25"/><text x="306" y="128" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#E5E9F2">Authorize</text><text x="306" y="150" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#A6B0C3">Context policy (the grant)</text><text x="306" y="168" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#A6B0C3">catalog.entity.read check</text>
<rect x="536" y="100" width="184" height="96" rx="8" fill="#151D30" stroke="#2A3550" stroke-width="1.25"/><text x="552" y="128" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#E5E9F2">Fetch + digest</text><text x="552" y="150" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#A6B0C3">Catalog records</text><text x="552" y="168" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#A6B0C3">SHA-256, canonical JSON</text>
<path d="M760 106A6 6 0 0 1 766 100H914A6 6 0 0 1 920 106V210L916 206L912 210L908 206L904 210L900 206L896 210L892 206L888 210L884 206L880 210L876 206L872 210L868 206L864 210L860 206L856 210L852 206L848 210L844 206L840 210L836 206L832 210L828 206L824 210L820 206L816 210L812 206L808 210L804 206L800 210L796 206L792 210L788 206L784 210L780 206L776 210L772 206L768 210L764 206L760 210Z" fill="#1E2650" stroke="#A3AEFF" stroke-width="1.5"/>
<text x="776" y="128" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#A3AEFF">Issued</text>
<text x="776" y="150" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#A6B0C3">Stored, immutable,</text>
<text x="776" y="168" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#A6B0C3">HMAC-tagged</text>
<text x="776" y="186" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#A6B0C3">TTL starts</text>
<path d="M242 148H286" fill="none" stroke="#A6B0C3" stroke-width="1.6" marker-end="url(#ah)"/><path d="M492 148H532" fill="none" stroke="#A6B0C3" stroke-width="1.6" marker-end="url(#ah)"/><path d="M722 148H756" fill="none" stroke="#A6B0C3" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M390 198V236" fill="none" stroke="#A6B0C3" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="300" y="240" width="182" height="50" rx="10" fill="#3A1520" stroke="#FF7F9A" stroke-width="1.25"/>
<g transform="translate(322 265) scale(1)"><rect x="-7.5" y="-7.5" width="15" height="15" rx="2.5" fill="#FF7F9A"/><rect x="-4.3" y="-1.25" width="8.6" height="2.5" rx="1" fill="#0D1322"/></g>
<text x="340" y="261" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#FF7F9A">RESOLVE_DENIED</text>
<text x="340" y="279" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#A6B0C3">No receipt is issued</text>
<path d="M840 216V296" fill="none" stroke="#A6B0C3" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="684" y="300" width="236" height="96" rx="8" fill="#151D30" stroke="#2A3550" stroke-width="1.25"/><text x="700" y="328" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#E5E9F2">Verify</text><text x="700" y="350" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#A6B0C3">POST /v1/receipts/:id/verify</text><text x="700" y="368" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#A6B0C3">binding, intent, policy, TTL,</text><text x="700" y="386" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#A6B0C3">permissions, source state</text>
<rect x="400" y="290" width="240" height="42" rx="10" fill="#11301F" stroke="#5BD09A" stroke-width="1.5"/>
<g transform="translate(422 311) scale(1)"><circle r="8" fill="#5BD09A"/><path d="M-3.6 0.2l2.5 2.6 4.8-5.2" fill="none" stroke="#0D1322" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="440" y="308" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#5BD09A">VALID</text>
<text x="440" y="324" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#A6B0C3">Matched at verification time</text>
<rect x="400" y="342" width="240" height="42" rx="10" fill="#33260C" stroke="#F2B451" stroke-width="1.5"/>
<g transform="translate(422 363) scale(1)"><path d="M5.8 3.2A6.6 6.6 0 1 1 5.4-3.9" fill="none" stroke="#F2B451" stroke-width="2.3" stroke-linecap="round"/><path d="M7.6-8.2L7.9-2.2 2-3.4Z" fill="#F2B451"/></g>
<text x="440" y="360" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#F2B451">REFRESH</text>
<text x="440" y="376" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#A6B0C3">No longer current</text>
<rect x="400" y="394" width="240" height="42" rx="10" fill="#3A1520" stroke="#FF7F9A" stroke-width="1.5"/>
<g transform="translate(422 415) scale(1)"><rect x="-7.5" y="-7.5" width="15" height="15" rx="2.5" fill="#FF7F9A"/><rect x="-4.3" y="-1.25" width="8.6" height="2.5" rx="1" fill="#0D1322"/></g>
<text x="440" y="412" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#FF7F9A">DENY</text>
<text x="440" y="428" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#A6B0C3">No longer permitted</text>
<path d="M682 348L645 311" fill="none" stroke="#A6B0C3" stroke-width="1.6" marker-end="url(#ah)"/><path d="M682 348H645" fill="none" stroke="#A6B0C3" stroke-width="1.6" marker-end="url(#ah)"/><path d="M682 348L645 415" fill="none" stroke="#A6B0C3" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="384" y="316" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" text-anchor="end" fill="#A6B0C3">Act on the recorded context</text>
<text x="384" y="368" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" text-anchor="end" fill="#F2B451">Re-resolve to get a new receipt</text>
<text x="384" y="420" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" text-anchor="end" fill="#A6B0C3">Do not act on this context</text>
<path d="M176 363H120V202" fill="none" stroke="#F2B451" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ahr)"/>
<path d="M40 440H920" stroke="#2A3550"/>
<text x="40" y="466" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#A6B0C3">TTL expiry yields REFRESH (TTL_EXPIRED). The old receipt stays as a record; a retention task prunes old receipts.</text>
<text x="40" y="486" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#E5E9F2">A verdict reflects source, permission and policy state at verification time only. Verify close to the action.</text>

</svg>
