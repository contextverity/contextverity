{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "cv.fullname" . }}
  labels:
    {{- include "cv.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "cv.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    # Only pods in this namespace (plus explicitly listed peers). The lab enables
    # guest sign-in and a control API, so it must not be reachable cluster-wide.
    # `kubectl port-forward` goes through the kubelet and is not affected.
    - from:
        - podSelector: {}
        {{- with .Values.networkPolicy.extraIngressFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      ports:
        - port: http
        - port: metrics
  egress:
    # DNS only. The backend reaches its own plugins over loopback.
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
{{- end }}
