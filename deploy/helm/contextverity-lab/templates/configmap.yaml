apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cv.fullname" . }}-config
  labels:
    {{- include "cv.labels" . | nindent 4 }}
data:
  app-config.kubernetes.yaml: |
    app:
      baseUrl: {{ .Values.baseUrl }}
    backend:
      baseUrl: {{ .Values.baseUrl }}
      listen:
        host: 0.0.0.0
        port: {{ .Values.service.port }}
      cors:
        origin: {{ .Values.baseUrl }}
        methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
        credentials: true
    auth:
      providers:
        guest:
          userEntityRef: user:default/alex
          # Lab only: guest sign-in outside NODE_ENV=development.
          dangerouslyAllowOutsideDevelopment: true
    contextverity:
      issuer: {{ .Values.contextverity.issuer }}
      defaultClassification: {{ .Values.contextverity.defaultClassification }}
    lab:
      catalogFile: /app/examples/lab/catalog.yaml
