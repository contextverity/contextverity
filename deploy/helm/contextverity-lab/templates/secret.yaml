{{- if not .Values.existingSecret }}
{{- $name := include "cv.secretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "cv.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if $existing }}
  CV_AGENT_TOKEN: {{ index $existing.data "CV_AGENT_TOKEN" }}
  CV_OTHER_AGENT_TOKEN: {{ index $existing.data "CV_OTHER_AGENT_TOKEN" }}
  CV_INTEGRITY_SECRET: {{ index $existing.data "CV_INTEGRITY_SECRET" }}
  {{- else }}
  CV_AGENT_TOKEN: {{ randAlphaNum 32 | b64enc }}
  CV_OTHER_AGENT_TOKEN: {{ randAlphaNum 32 | b64enc }}
  CV_INTEGRITY_SECRET: {{ randAlphaNum 48 | b64enc }}
  {{- end }}
{{- end }}
