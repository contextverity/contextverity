apiVersion: v1
kind: Pod
metadata:
  name: {{ include "cv.fullname" . }}-test-health
  # Distinct labels: the chart's NetworkPolicy (DNS-only egress) must not apply here.
  labels:
    app.kubernetes.io/name: {{ include "cv.name" . }}-test
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: health
      image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      command:
        - node
        - -e
        - >-
          fetch('http://{{ include "cv.fullname" . }}:{{ .Values.service.port }}/.backstage/health/v1/readiness')
          .then(r => { console.log('readiness', r.status); process.exit(r.ok ? 0 : 1) })
          .catch(e => { console.error(e.message); process.exit(1) })
