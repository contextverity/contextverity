# ContextVerity lab configuration (local, synthetic, development only).
# Secrets and tokens come from environment variables generated by
# `make demo-up` into .demo/env; nothing secret is committed.

app:
  title: ContextVerity Lab
  baseUrl: http://127.0.0.1:3000
  packages: all

organization:
  name: ContextVerity Lab

backend:
  baseUrl: http://127.0.0.1:7007
  listen:
    port: 7007
    host: 127.0.0.1
  csp:
    connect-src: ["'self'", 'http:', 'https:']
  cors:
    origin: http://127.0.0.1:3000
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true
  database:
    client: better-sqlite3
    connection:
      # One SQLite file per plugin; persists across restarts.
      directory: ${CV_DATA_DIR}
  auth:
    externalAccess:
      # Static tokens identify two synthetic agents (service principals).
      - type: static
        options:
          token: ${CV_AGENT_TOKEN}
          subject: incident-agent
      - type: static
        options:
          token: ${CV_OTHER_AGENT_TOKEN}
          subject: other-agent
  actions:
    # Expose ContextVerity's (and the catalog's) actions to the MCP backend.
    pluginSources:
      - catalog
      - contextverity

auth:
  environment: development
  providers:
    guest:
      userEntityRef: user:default/alex

permission:
  enabled: true

catalog:
  rules:
    - allow:
        [Component, System, API, Resource, Location, Group, User, AiResource]
  locations: []

mcpActions:
  name: contextverity-lab
  description: Backstage MCP Actions endpoint of the ContextVerity lab

contextverity:
  issuer: lab-local
  defaultClassification: INTERNAL
  integritySecret: ${CV_INTEGRITY_SECRET}
  policyFile: ${CV_POLICY_FILE}
  retention:
    days: 30

lab:
  catalogFile: ../../examples/lab/catalog.yaml
